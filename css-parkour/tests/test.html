<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>CSS Parkour – automatické testy levelů</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; background: #0f172a; color: #e2e8f0; }
    iframe { width: 800px; height: 400px; border: 0; display: block; margin-bottom: 1rem; }
    pre { white-space: pre-wrap; }
    .ok { color: #4ade80; } .bad { color: #f87171; font-weight: 700; }
    .summary { font-size: 1.3rem; font-weight: 800; margin: 0 0 1rem; padding: .6rem 1rem; border-radius: 10px; background: #1e293b; }
  </style>
</head>
<body>
  <h1>CSS Parkour – testy levelů</h1>
  <p>Každý level se spustí se vzorovým řešením (musí vyhrát), s výchozím kódem a s typickými chybami (musí prohrát).
    Fyzika běží zrychleně, CSS animace řídí hodiny simulace.</p>
  <div id="summary" class="summary">⏳ Testy běží…</div>
  <iframe id="frame" title="scéna"></iframe>
  <pre id="out">Běží…</pre>
  <script src="../js/levels.js"></script>
  <script src="../js/lessons.js"></script>
  <script src="../js/engine.js"></script>
  <script src="lessons-check.js"></script>
  <script src="test.js"></script>
</body>
</html>
