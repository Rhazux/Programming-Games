<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Studio Tycoon – postav si webové studio</title>
  <meta name="description" content="Vzdělávací hra: vedeš webové studio a pro klienty stavíš weby v HTML a JavaScriptu. Automatické testy, živý náhled, peníze, vybavení studia.">
  <meta name="theme-color" content="#2b59ff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏢</text></svg>">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="homeBtn" title="Úvod"><span class="logo-ico" aria-hidden="true">🏢</span><span class="brand-text">Web Studio <b>Tycoon</b></span></button>
    <div class="crumb" id="crumb"></div>
    <div class="top-actions">
      <span class="top-stat money" id="topMoney" title="Peníze studia"><span class="ico">💰</span>0 Kč</span>
      <span class="top-stat" id="topStars" title="Reputace (hvězdy)"><span class="ico">★</span>0/36</span>
      <button class="icon-btn" id="mapBtn" hidden>🏢 <span class="lbl">Studio</span></button>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" title="Zvuk" aria-label="Zvuk">🔊</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <!-- skrytá stránka, na které běží automatické testy požadavků -->
  <iframe id="testFrame" class="test-frame" title="testy" tabindex="-1" aria-hidden="true"></iframe>

  <noscript><p style="padding:2rem;text-align:center">Hra potřebuje zapnutý JavaScript.</p></noscript>

  <script src="js/kit.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
